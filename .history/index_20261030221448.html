<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEART_BREAK Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            flex-direction: column;
        }

        /* Realistic Stars Animation */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 1; }
        }

        /* Moon Setup */
        #moon {
            position: absolute;
            top: 8%;
            width: 220px;
            z-index: 1;
            transition: opacity 1.5s ease-in-out;
        }

        /* Glossy Red Heart Setup */
        #heart {
            position: absolute;
            top: 40%;
            width: 380px;
            z-index: 2; 
            opacity: 0; 
            transition: opacity 2s ease-in-out; 
            mix-blend-mode: screen; 
        }

        /* Hands VIDEO Setup - Box effect hataya aur Mask lagaya */
        #hands {
            position: absolute;
            bottom: 5%;
            width: 280px;
            z-index: 3;
            /* Video ke edges ko black background me smooth fade karne ka jadoo */
            -webkit-mask-image: radial-gradient(circle, black 50%, transparent 100%);
            mask-image: radial-gradient(circle, black 50%, transparent 100%);
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            z-index: 10;
            background: rgba(0,0,0,0.9);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 15px 40px;
            font-size: 22px;
            cursor: pointer;
            background-color: #e60000;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(230,0,0,0.5);
            transition: 0.3s;
        }
        button:hover {
            background-color: #ff3333;
        }
    </style>
</head>
<body>

    <audio id="bg-music">
        <source src="jana jaha.mp3" type="audio/mpeg">
    </audio>

    <div id="start-screen">
        <button onclick="startProject()">Start Project 🎵</button>
    </div>

    <img id="moon" src="Crisp Detailed Full Moon (2).png" alt="Moon">
    
    <img id="heart" src="Glossy Red Heart on Black (1).png" alt="Heart">
    
    <video id="hands" src="romantic_hands_approach_7sec (1).mp4" muted playsinline></video>

    <script>
        // Generate random realistic stars
        const numStars = 200; 
        for (let i = 0; i < numStars; i++) {
            let star = document.createElement("div");
            star.className = "star";
            
            let size = Math.random() * 2.5 + "px";
            star.style.width = size;
            star.style.height = size;
            star.style.left = Math.random() * 100 + "vw";
            star.style.top = Math.random() * 100 + "vh";
            
            star.style.animationDuration = (Math.random() * 3 + 1) + "s";
            document.body.appendChild(star);
        }

        function startProject() {
            document.getElementById('start-screen').style.display = 'none';
            
            let audio = document.getElementById('bg-music');
            audio.play();

            let video = document.getElementById('hands');
            video.currentTime = 0; 
            video.play();

            // 3.5 seconds baad heart aayega aur moon gayab ho jayega
            setTimeout(() => {
                document.getElementById('heart').style.opacity = '1';
                document.getElementById('moon').style.opacity = '0';
            }, 3500); 
        }
    </script>
</body>
</html>
