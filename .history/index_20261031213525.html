<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEART_BREAK Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        /* Realistic Stars Animation */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 1; }
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Moon Setup */
        #moon {
            position: absolute;
            width: 650px; 
            z-index: 1;
            transition: opacity 1.5s ease-in-out;
        }

        /* Photo Container - Yehi wo main trick hai jisse moon aur photo mix honge */
        #photo-container {
            position: absolute;
            width: 580px; 
            height: 580px; 
            z-index: 2; 
            opacity: 0.85; /* Thodi opacity kam ki */
            mix-blend-mode: multiply; /* Safed background gayab aur moon ke sath blend */
            border-radius: 50%; 
            overflow: hidden;
            transition: opacity 1.5s ease-in-out; 
            /* Kinaro ko halka sa soft karne ke liye mask */
            -webkit-mask-image: radial-gradient(circle, black 70%, transparent 100%);
            mask-image: radial-gradient(circle, black 70%, transparent 100%);
        }

        /* 5 Photos ke liye smooth fast transition */
        .slideshow-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0; 
            transition: opacity 0.8s ease-in-out; 
        }

        /* Heart Setup */
        #heart {
            position: absolute;
            width: 650px; 
            z-index: 3; 
            opacity: 0; 
            transform: scale(0.2); 
            transition: opacity 1.5s ease-in-out, transform 2.5s ease-out; 
        }

        #start-screen {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.9);
        }

        #restart-screen {
            display: none; 
            position: absolute;
            z-index: 10;
            top: 30px; 
            right: 40px; 
        }

        button {
            padding: 15px 40px;
            font-size: 22px;
            cursor: pointer;
            background-color: #e60000;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(230,0,0,0.5);
            transition: 0.3s;
        }
        button:hover {
            background-color: #ff3333;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 600px) {
            #moon, #heart { width: 95vw; }
            #photo-container { 
                width: 85vw; 
                height: 85vw; 
                /* Mobile me bhi blend mode kaam karega aur white background hatega */
                mix-blend-mode: multiply;
            }
            #restart-screen { top: 20px; right: 20px; }
            button { padding: 12px 30px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" preload="auto">
        <source src="jana jaha.mp3" type="audio/mpeg">
    </audio>

    <div id="start-screen">
        <button onclick="startProject(false)">feel this emotion 🥺</button>
    </div>

    <div id="restart-screen">
        <button onclick="startProject(true)">Play Again 🔄</button>
    </div>

    <div class="scene">
        <img id="moon" src="Crisp Detailed Full Moon (2).png" alt="Moon">
        
        <!-- Yahan par 5 photos add hain -->
        <div id="photo-container">
            <img class="slideshow-img" id="img1" src="images (9) (1).jpeg" alt="Photo 1">
            <img class="slideshow-img" id="img2" src="images (10).jpeg" alt="Photo 2">
            <img class="slideshow-img" id="img3" src="images (11).jpeg" alt="Photo 3">
            <img class="slideshow-img" id="img4" src="images (12).jpeg" alt="Photo 4">
            <img class="slideshow-img" id="img5" src="photo 4_2.jpg" alt="Photo 5">
        </div>

        <img id="heart" src="Glossy Red Heart on Black (1).png" alt="Heart">
    </div>

    <script>
        // Generate random realistic stars
        const numStars = 200; 
        for (let i = 0; i < numStars; i++) {
            let star = document.createElement("div");
            star.className = "star";
            let size = Math.random() * 2.5 + "px";
            star.style.width = size;
            star.style.height = size;
            star.style.left = Math.random() * 100 + "vw";
            star.style.top = Math.random() * 100 + "vh";
            star.style.animationDuration = (Math.random() * 3 + 1) + "s";
            document.body.appendChild(star);
        }

        let mainTimer; 
        let slideTimers = [];

        function startProject(isRestart) {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('restart-screen').style.display = 'none';
            
            let audio = document.getElementById('bg-music');
            let moon = document.getElementById('moon');
            let photoContainer = document.getElementById('photo-container');
            let heart = document.getElementById('heart');
            let imgs = document.querySelectorAll('.slideshow-img');

            moon.style.opacity = '1';
            photoContainer.style.opacity = '0.85'; // Opacity reset match kiya
            heart.style.opacity = '0';
            heart.style.transform = 'scale(0.2)';
            
            imgs.forEach(img => img.style.opacity = '0'); 

            clearTimeout(mainTimer);
            slideTimers.forEach(timer => clearTimeout(timer));
            slideTimers = [];
            
            if(isRestart) { audio.load(); }
            
            audio.currentTime = 0; 
            audio.play().catch(e => console.log("Audio Error:", e));

            // 5 Photo Animation Logic (Har 1.6 seconds me change)
            imgs[0].style.opacity = '1'; 

            slideTimers.push(setTimeout(() => { imgs[0].style.opacity = '0'; imgs[1].style.opacity = '1'; }, 1600)); // 2nd photo
            slideTimers.push(setTimeout(() => { imgs[1].style.opacity = '0'; imgs[2].style.opacity = '1'; }, 3200)); // 3rd photo
            slideTimers.push(setTimeout(() => { imgs[2].style.opacity = '0'; imgs[3].style.opacity = '1'; }, 4800)); // 4th photo
            slideTimers.push(setTimeout(() => { imgs[3].style.opacity = '0'; imgs[4].style.opacity = '1'; }, 6400)); // 5th photo

            // Exact 8 seconds baad moon aur photos gayab, heart ayega
            mainTimer = setTimeout(() => {
                moon.style.opacity = '0'; 
                photoContainer.style.opacity = '0'; 
                
                heart.style.opacity = '1'; 
                heart.style.transform = 'scale(1)'; 
            }, 8000); 
        }

        document.getElementById('bg-music').onended = function() {
            document.getElementById('restart-screen').style.display = 'block';
        };
    </script>
</body>
</html>
