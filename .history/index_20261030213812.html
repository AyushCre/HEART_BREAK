<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEART_BREAK Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        /* Realistic Stars Animation */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 1; }
        }

        /* Moon Setup */
        #moon {
            position: absolute;
            top: 2%;
            width: 350px;
            z-index: 1;
        }

        /* Hands Setup */
        #hands {
            position: absolute;
            bottom: 5%;
            width: 450px;
            z-index: 2;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(255,255,255,0.1);
        }

        /* Glossy Red Heart Setup (Initial opacity 0) */
        #heart {
            position: absolute;
            bottom: 25%;
            width: 180px;
            z-index: 3;
            opacity: 0; 
            transition: opacity 2s ease-in-out; 
        }

        /* Start Screen (Audio autoplay policy ke liye) */
        #start-screen {
            position: absolute;
            z-index: 10;
            background: rgba(0,0,0,0.9);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 15px 40px;
            font-size: 22px;
            cursor: pointer;
            background-color: #e60000;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(230,0,0,0.5);
            transition: 0.3s;
        }
        button:hover {
            background-color: #ff3333;
        }
    </style>
</head>
<body>

    <!-- Background Music exactly as in your folder -->
    <audio id="bg-music">
        <source src="jana jaha.mp3" type="audio/mpeg">
    </audio>

    <!-- Play Button Screen -->
    <div id="start-screen">
        <button onclick="startProject()">Start Project 🎵</button>
    </div>

    <!-- Images exactly as in your folder -->
    <img id="moon" src="Crisp Detailed Full Moon (2).png" alt="Moon">
    
    <img id="hands" src="romantic_hands_smooth_once (1).jpg" alt="Hands">
    
    <img id="heart" src="Glossy Red Heart on Black (1).png" alt="Heart">

    <script>
        // Generate random realistic stars
        const numStars = 200; 
        for (let i = 0; i < numStars; i++) {
            let star = document.createElement("div");
            star.className = "star";
            
            let size = Math.random() * 2.5 + "px";
            star.style.width = size;
            star.style.height = size;
            star.style.left = Math.random() * 100 + "vw";
            star.style.top = Math.random() * 100 + "vh";
            
            star.style.animationDuration = (Math.random() * 3 + 1) + "s";
            document.body.appendChild(star);
        }

        // Logic to start everything
        function startProject() {
            document.getElementById('start-screen').style.display = 'none';
            
            let audio = document.getElementById('bg-music');
            audio.play();

            setTimeout(() => {
                document.getElementById('heart').style.opacity = '1';
            }, 3500); 
        }
    </script>
</body>
</html>
